ntent-card{max-width:760px;margin:42px auto 25px;min-height:310px;background:linear-gradient(130deg,var(--accent),#fdf8f2);border-radius:32px;padding:35px;display:grid;grid-template-columns:210px 1fr;gap:27px;color:#3d3348;box-shadow:0 24px 60px #08061344}.orb{background:#ffffff90;border-radius:27px;min-height:210px;display:flex;align-items:center;justify-content:center;font-size:90px}.content-copy{display:flex;justify-content:center;align-items:flex-start;flex-direction:column}.type{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800;opacity:.58}.content-copy h2{font-family:Manrope;font-size:27px;letter-spacing:-1px;margin:10px 0}.content-copy p{font-size:14px;line-height:1.7;margin:0 0 20px}.heart{color:#704b64;background:#ffffff80;border-radius:12px;padding:9px 11px;font-size:11px}.heart.active{color:#c65b89}.center{display:flex;margin:auto}.completion,.wish,.stress,.favorites{text-align:center;max-width:850px;margin:auto}.finish-cat{font-size:100px;animation:float 4s ease-in-out infinite}.completion h2{margin:6px 0 26px}.feedback{display:flex;justify-content:center;gap:10px}.feedback button,.after>div button{background:#ffffff13;padding:12px 19px;border:1px solid #ffffff1b;border-radius:14px}.after{display:grid;gap:14px;justify-items:center}.after p{color:#d3cadb}.text-btn{padding:9px;background:transparent;color:#d7c9eb;text-decoration:underline;font-size:12px}.wizard{font-size:115px;position:relative;display:inline-block;filter:drop-shadow(0 8px 20px #0004);animation:float 4s ease-in-out infinite}.wish-result{margin:26px auto;max-width:600px;padding:30px;background:#ffffff10;border:1px solid #ffffff1b;border-radius:25px}.wish-result p{font:600 25px/1.4 'Playfair Display',serif;margin-top:0}.wish-result small{display:block;margin-top:18px;color:#bdb4c7}.stress h2,.favorites h2{margin-bottom:30px}.stress-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left}.stress article{background:#ffffff0d;border:1px solid #ffffff1 nslateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){nav{height:63px;padding:0 16px}.nav-links{gap:4px}.nav-links>button:not(.fav-nav):not(.sound){display:none}.nav-links .fav-nav span{display:none}.page{padding:32px 17px 55px}.home-grid{grid-template-columns:1fr;gap:26px}.intro{text-align:center}.lead{margin-left:auto;margin-right:auto}.moods{text-align:left}.hero-cat{height:355px;border-radius:29px}.moon{font-size:70px;right:28px;top:25px}.cat-face{font-size:145px;top:80px}.quick{right:16px;bottom:17px}.cat-bubble{left:17px;bottom:17px;max-width:190px;font-size:10px}.cat-line{gap:6px}.mini-cat{padding:6px 2px}.mini-cat small{font-size:8px}.content-card{margin-top:27px;padding:20px;grid-template-columns:1fr;gap:17px;min-height:0;border-radius:25px}.orb{min-height:125px;font-size:68px}.content-copy h2{font-size:23px}.stress-grid,.fav-grid{grid-template-columns:1fr}.stress article{min-height:270px}.stars{top:70px;left:3%}h1{font-size:49px}.wish-result p{font-size:21px}.completion{padding-top:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><main><div class="aurora a1"></div><div class="aurora a2"></div><div class="stars">✦　·　✧　·　⋆　·　✦</div><nav><button class="brand" onclick="show('home')"><span>✦</span> ЭНДОРФИН</button><div class="nav-links"><button onclick="showWish()">Пожелание</button><button onclick="showStress()">Антистресс</button><button onclick="showLove()">Мне нужно любви</button><button class="fav-nav" onclick="showFavorites()">♡ <span>Моё</span></button><button class="sound" onclick="toggleSound()" id="sound">♫ on</button></div></nav><div id="app"></div><footer>Сделано с мурчанием · Это пространство для лёгкой эмоциональной паузы, не медицинский сервис.</footer></main>
<script>
const data={cat:[['Кот-Уют','Видит плед в каждой сложной ситуации. Сегодня он рядом с тобой.','🐈','#ffd59e'],['Кот-Оптимист','Уверен: впереди есть что-то вкусное.','🐱','#f9df73'],['Кот-Хулиган','Немного дерзкий. Очень смешной.','😸','#f3ae9b'],['Кот-Мудрец','Знает, когда стоит просто посидеть.','😺','#c4a9e8']],compliment:[['Небольшое напоминание','Тебе не нужно быть продуктивным каждую минуту.','💌','#eeb2d0'],['Ты справляешься','Давай просто переживём этот день маленькими шагами.','🌷','#d8b7ee'],['Разрешение на паузу','Сегодня тебе можно немного отдохнуть. Правда можно.','🫶','#facb92']],visual:[['Тихий вечер','Представь: город замедлился, а небо бережно зажгло для тебя звёзды.','🌙','#b7c7eb'],['Тёплое море','Волна приходит и уходит. Тебе тоже не нужно держать всё в себе.','🌊','#a6e0d8'],['Золотой час','Свет ложится на всё мягко. Пусть и к себе ты сегодня будешь помягче.','🌅','#f6bd85']],music:[['Саундтрек паузы','Сделай вдох на четыре счёта. Выдох — чуть длиннее. Кот слушает вместе с тобой.','🎧','#c1b9ee'],['Медленный ритм','Несколько спокойных минут — это уже маленькая забота о себе.','🎶','#b0dca2']],fact:[['Факт от Мудреца','Кошки мурлычут не только от радости — это ещё и их способ успокоить себя.','🧠','#c4a9e8'],['Маленькое чудо','Запах после дождя называется петрикор. Теперь у этого ощущения есть имя.','☔','#a3d6e8'],['Чуть-чуть космоса','Свет от Луны добирается до нас примерно за 1,3 секунды.','🌕','#e2d283']],meme:[['Настроение дня','Я: сейчас соберусь. Кот: а давай лучше полежим профессионально.','😹','#f3ae9b'],['Важное совещание','Повестка: вкусняшка, сон и почему ты всё ещё не гладишь кота.','🐾','#f7c889']],interactive:[['Микро-приключение','Найди вокруг себя три вещи приятного цвета. Мир умеет подмигивать.','🔎','#9cd9bd']]};
const moods=[['sad','😔','Грустно'],['anxious','😰','Тревожно'],['angry','😡','Злюсь'],['tired','🥱','Устал(а)'],['bored','😶','Скучно'],['overloaded','🫠','Перегружен(а)'],['lonely','💔','Одиноко'],['pleasant','✨','Хочу приятного']];const sequences={sad:['cat','compliment','visual','music','fact'],anxious:['visual','music','cat','compliment','visual'],angry:['meme','cat','fact','music','compliment'],tired:['visual','cat','music','compliment','cat'],bored:['fact','meme','interactive','cat','visual'],overloaded:['visual','cat','music','compliment','fact'],lonely:['cat','compliment','music','visual','cat'],pleasant:['cat','visual','compliment','fact','music']};const wishes=['Сегодня тебя ждёт маленькая неожиданная радость.','Кто-то сегодня обязательно поднимет тебе настроение.','Сегодня хороший день для маленькой награды себе.','Ты заметишь что-то красивое именно в нужный момент.','Пусть сегодня будет хотя бы один момент: «вот это приятно».'];let session=[],step=0,love, surprise;const app=document.querySelector('#app');const pick=a=>a[Math.floor(Math.random()*a.length)];const item=(kind)=>{let x=pick(data[kind]);return {kind,title:x[0],text:x[1],emoji:x[2],color:x[3],id:kind+x[0]}};const favorites=()=>JSON.parse(localStorage.getItem('endorphin-html-favorites')||'[]');const saveFav=x=>{let f=favorites(),i=f.findIndex(y=>y.id===x.id);i<0?f.push(x):f.splice(i,1);localStorage.setItem('endorphin-html-favorites',JSON.stringify(f));renderCard(x,'Сохранено');};const page=x=>`<section class="page">${x}</section>`;const home=()=>page(`<div class="home-grid"><div class="intro"><p class="eyebrow">ТВОЯ МАЛЕНЬКАЯ ПАУЗА</p><h1>Как ты себя<br><em>чувствуешь?</em></h1><p class="lead">Выбери состояние, а кот сам соберёт для тебя пять приятных вещей. Тебе не нужно ничего решать.</p><div class="moods">${moods.map(m=>`<button class="mood" onclick="start('${m[0]}')"><span>${m[1]}</span>${m[2]}</button>`).join('')}</div><button class="primary" onclick="start(pick(moods)[0])">✦ Не знаю — пусть кот решит</button></div><aside class="hero-cat"><div class="moon">☾</div><div class="cat-face">🐈</div><div class="cat-bubble"><b>Привет, я Кот-Уют</b><br>Я уже рядом. Давай чуть-чуть выдохнем.</div><div class="quick"><button onclick="showWish()">🔮 Пожелание дня</button><button onclick="showSurprise()">🎲 Удиви меня</button></div></aside></div><div class="cat-line">${[['🐈','Уют'],['🐱','Оптимист'],['😸','Хулиган'],['😺','Мудрец'],['🧙‍♂️','Волшебник']].map(x=>`<div class="mini-cat"><span>${x[0]}</span><small>${x[1]}</small></div>`).join('')}</div>`);function show(x){app.innerHTML=home()}function start(m){session=sequences[m].map(item);step=0;renderCard(session[0],'Эндорфиновая сессия')}function renderCard(x,heading){let saved=favorites().some(y=>y.id===x.id);app.innerHTML=page(`<div class="session-head"><p class="eyebrow">${heading}</p><span>${heading==='Эндорфиновая сессия'?'Шаг '+(step+1)+' из 5 · Кот всё продумал за тебя':'Кот считает, что сейчас тебе нужен именно этот маленький сюрприз.'}</span></div><div class="content-card" style="--accent:${x.color}"><div class="orb">${x.emoji}</div><div class="content-copy"><span class="type">✦ маленькая приятность</span><h2>${x.title}</h2><p>${x.text}</p><button class="heart ${saved?'active':''}" onclick='saveFav(${JSON.stringify(x)})'>${saved?'♥ В моём':'♡ Сохранить'}</button></div></div><button class="primary center" onclick="next()">${heading==='Эндорфиновая сессия'?(step===4?'Завершить сессию':'Следующая приятность →'):'Ещё сюрприз →'}</button>`)}function next(){if(step<4){step++;renderCard(session[step],'Эндорфиновая сессия')}else finish()}function finish(){app.innerHTML=page(`<div class="completion"><div class="finish-cat">😺</div><p class="eyebrow">СЕССИЯ ЗАВЕРШЕНА</p><h2>Ну что, стало<br><em>немного лучше?</em></h2><div class="feedback"><button onclick="after()">🙂 Да</button><button onclick="after()">😐 Немного</button><button onclick="after()">😔 Нет</button></div></div>`)}function after(){app.innerHTML=page(`<div class="completion"><div class="finish-cat">😺</div><h2>Кот гордится тобой</h2><div class="after"><p>Ты сделал(а) паузу. Это уже важно.</p><button class="primary" onclick="showSurprise()">Ещё приятность</button><button class="text-btn" onclick="show('home')">Вернуться на главную</button></div></div>`)}function showWish(){let date=new Date().toDateString(),w=JSON.parse(localStorage.getItem('endorphin-html-wish')||'null');let reveal=()=>{w={date,text:pick(wishes)};localStorage.setItem('endorphin-html-wish',JSON.stringify(w));showWish()};app.innerHTML=page(`<div class="wish"><div class="wizard">🧙‍♂️</div><p class="eyebrow">КОТ-ВОЛШЕБНИК ШЕПЧЕТ</p><h2>Пожелание дня</h2>${w&&w.date===date?`<div class="wish-result"><p>«${w.text}»</p><small>Новое пожелание появится завтра. А это — твоё на сегодня.</small></div>`:`<p>Одно доброе слово от звёзд — только для тебя.</p><button class="primary" onclick="(${reveal.toString()})()">✦ Узнать пожелание</button>`}</div>`)}function showSurprise(){surprise=item(pick(Object.keys(data)));renderCard(surprise,'Кот выбрал для тебя')}function showLove(){love=item('compliment');renderCard(love,'Немного любви для тебя')}function showStress(){let bubbles=Array.from({length:14},(_,i)=>`<button class="bubble" style="--s:${30+i%4*12}px" onclick="this.remove()"></button>`).join('');app.innerHTML=page(`<div class="stress"><p class="eyebrow">БЕЗ ЦЕЛИ, БЕЗ СПЕШКИ</p><h2>🧸 Антистресс</h2><div class="stress-grid"><article><h3>Погладь кота</h3><p>Он мурчит, когда ему приятно.</p><button class="pet-cat" onclick="this.innerHTML='😻<span>муррр...</span>'">🐈<span>погладить</span></button></article><article><h3>Лопай пузырьки</h3><p>Ничего не нужно делать правильно.</p><div class="bubbles">${bubbles}</div><button class="text-btn" onclick="showStress()">Ещё пузырьки</button></article></div></div>`)}function showFavorites(){let f=favorites();app.innerHTML=page(`<div class="favorites"><p class="eyebrow">ТВОЯ КОЛЛЕКЦИЯ ТЁПЛОГО</p><h2>❤️ Моё</h2>${f.length?`<div class="fav-grid">${f.map(x=>`<article style="--accent:${x.color}"><span>${x.emoji}</span><h3>${x.title}</h3><p>${x.text}</p><button onclick='saveFav(${JSON.stringify(x)})'>× убрать</button></article>`).join('')}</div>`:`<div class="empty">♡<p>Здесь будут вещи, к которым захочется вернуться.</p><small>Нажимай «Сохранить» в сессии, пожеланиях и сюрпризах.</small></div>`}</div>`)}function toggleSound(){let b=document.querySelector('#sound');b.textContent=b.textContent.includes('on')?'♫ off':'♫ on'}show('home');
</script><script>
  // Override the wish screen so it works in a standalone file as well.
  function revealWish(){ localStorage.setItem('endorphin-html-wish', JSON.stringify({date:new Date().toDateString(), text:pick(wishes)})); showWish(); }
  function showWish(){
    const date=new Date().toDateString(), w=JSON.parse(localStorage.getItem('endorphin-html-wish')||'null');
    app.innerHTML=page(`<div class="wish"><div class="wizard">🧙‍♂️</div><p class="eyebrow">КОТ-ВОЛШЕБНИК ШЕПЧЕТ</p><h2>Пожелание дня</h2>${w&&w.date===date?`<div class="wish-result"><p>«${w.text}»</p><small>Новое пожелание появится завтра. А это — твоё на сегодня.</small></div>`:`<p>Одно доброе слово от звёзд — только для тебя.</p><button class="primary" onclick="revealWish()">✦ Узнать пожелание</button>`}</div>`);
  }
</script></body></html>
